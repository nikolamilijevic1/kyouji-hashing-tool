[project]
name = "frontend"
version = "0.1.0"
description = "Frontend for Kyouji Hashing Tool"
authors = [
    { name = "Administrator" }
]
requires-python = ">=3.13"
dependencies = [
    "streamlit>=1.35.0",
    "httpx>=0.27.0",
    "pandas>=2.2.2",
    "pillow>=10.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["frontend"]
