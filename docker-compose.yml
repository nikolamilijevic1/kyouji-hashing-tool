services:
  backend:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    container_name: forensic-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: always

  frontend:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    container_name: forensic-frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: always
